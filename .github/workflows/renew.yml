name: FreeGameHost Auto Renew

on:
  schedule:
    # 每 2 小时执行一次（8 小时有效期 + 2 小时冷却）
    - cron: "15 */2 * * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.49.1

      - name: Restore & Save Session Cookies
        uses: actions/cache@v4
        with:
          path: state
          key: fgh-cookies-${{ github.run_id }}
          restore-keys: |
            fgh-cookies-

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          pip install -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              -o Dpkg::Options::="--force-confdef" \
              -o Dpkg::Options::="--force-confold" \
              ffmpeg
          fi
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          sudo env DEBIAN_FRONTEND=noninteractive "$(which playwright)" install-deps chromium

      - name: Install sing-box (if using hy2 proxy)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          if [[ "${PROXY_URL,,}" == hy2://* || "${PROXY_URL,,}" == hysteria2://* ]]; then
            echo "检测到 hy2 代理，正在安装 sing-box..."
            SB_TAG=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/SagerNet/sing-box/releases/latest | awk -F'/tag/' '{print $2}')
            SB_VER="${SB_TAG#v}"
            curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/${SB_TAG}/sing-box-${SB_VER}-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            sudo mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" /usr/local/bin/sing-box
            sudo chmod +x /usr/local/bin/sing-box
            sing-box version
          fi

      - name: Run FreeGameHost Auto Renew
        env:
          FGH_USERNAME: ${{ secrets.FGH_USERNAME }}
          FGH_PASSWORD: ${{ secrets.FGH_PASSWORD }}
          FGH_COOKIES: ${{ secrets.FGH_COOKIES }}
          FGH_SERVER_IDS: ${{ secrets.FGH_SERVER_IDS }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_ALWAYS_NOTIFY: ${{ vars.TG_ALWAYS_NOTIFY || '0' }}
        run: python renew.py

      - name: Upload Screenshots (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-screenshots
          path: screenshots/
          retention-days: 3
